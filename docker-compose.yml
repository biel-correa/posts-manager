services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-post-manager
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-linkedin_post_manager}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-gemini-3.8-flash}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-nano-banana-2.1}
      - GEMINI_SEARCH_GROUNDING=${GEMINI_SEARCH_GROUNDING:-true}
      - GEMINI_IMAGE_GENERATION=${GEMINI_IMAGE_GENERATION:-true}
      - TZ=${TZ:-America/Sao_Paulo}
      - POSTS_PER_WEEK=${POSTS_PER_WEEK:-3}
      - SUNDAY_CRON=${SUNDAY_CRON:-0 8 * * 0}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: linkedin-post-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
